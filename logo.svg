<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Escudo Peyoteros">
  <defs>
    <path id="arcTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none"/>
    <path id="arcBot" d="M 27 100 A 73 73 0 0 0 173 100" fill="none"/>
    <g id="lobe">
      <ellipse cx="100" cy="63" rx="13" ry="19" fill="#77b05e" stroke="#111" stroke-width="2.4"/>
      <circle cx="100" cy="55" r="2.3" fill="#fff"/>
      <circle cx="95"  cy="65" r="2.1" fill="#fff"/>
      <circle cx="105" cy="65" r="2.1" fill="#fff"/>
    </g>
  </defs>

  <!-- disc -->
  <circle cx="100" cy="100" r="99" fill="#3f7cb5"/>
  <circle cx="100" cy="100" r="99" fill="none" stroke="#2b5c8a" stroke-width="2"/>
  <!-- outer white ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#fff" stroke-width="3"/>

  <!-- tricolor accents bottom -->
  <path d="M 40 100 A 60 60 0 0 0 78 156" fill="none" stroke="#3aa34a" stroke-width="6" stroke-linecap="butt"/>
  <path d="M 160 100 A 60 60 0 0 1 122 156" fill="none" stroke="#e0342b" stroke-width="6" stroke-linecap="butt"/>

  <!-- arc text -->
  <text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="21" letter-spacing="3">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">PEYOTEROS</textPath>
  </text>
  <text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="17" letter-spacing="6">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">2019</textPath>
  </text>

  <!-- peyote flower: 9 lobes around center -->
  <g transform="translate(100 102) scale(0.88) translate(-100 -100)">
    <use href="#lobe" transform="rotate(0 100 100)"/>
    <use href="#lobe" transform="rotate(40 100 100)"/>
    <use href="#lobe" transform="rotate(80 100 100)"/>
    <use href="#lobe" transform="rotate(120 100 100)"/>
    <use href="#lobe" transform="rotate(160 100 100)"/>
    <use href="#lobe" transform="rotate(200 100 100)"/>
    <use href="#lobe" transform="rotate(240 100 100)"/>
    <use href="#lobe" transform="rotate(280 100 100)"/>
    <use href="#lobe" transform="rotate(320 100 100)"/>
  </g>
  <!-- center + star -->
  <circle cx="100" cy="100" r="16" fill="#77b05e" stroke="#111" stroke-width="2.4"/>
  <path d="M100,87 L103.06,95.79 L112.36,95.98 L104.95,101.61 L107.64,110.52 L100,105.2 L92.36,110.52 L95.05,101.61 L87.64,95.98 L96.94,95.79 Z"
        fill="#e0342b" stroke="#111" stroke-width="1.2"/>
</svg>
