name: Scrape league table
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # allow manual runs
permissions:
  contents: write
concurrency:
  group: league
  cancel-in-progress: true
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/scrape-league.mjs
      - name: Commit if changed
        run: |
          git config user.name "peyoteros-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add league.json
          git diff --staged --quiet || git commit -m "Update league table [skip ci]" -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git push
